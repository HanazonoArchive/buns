# Everything binds to 127.0.0.1 only: nothing in this lab is reachable from
# the network the laptop is on.

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-buns-local-key}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config connection.timeoutInSecs=30
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY:-buns-local-key}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  buns:
    build: .
    environment:
      ZAP_URL: http://zap:8080
      ZAP_API_KEY: ${ZAP_API_KEY:-buns-local-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # Inside the Compose network Juice Shop is reached by its service name.
      BUNS_ALLOWED_HOSTS: juice-shop,localhost,127.0.0.1
      BUNS_SEED_TARGET: http://juice-shop:3000
      BUNS_SEED_OWNER_NAME: ${BUNS_SEED_OWNER_NAME:-}
      BUNS_SEED_OWNER_EMAIL: ${BUNS_SEED_OWNER_EMAIL:-}
      BUNS_PUBLIC_URL: ${BUNS_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - buns-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      juice-shop:
        condition: service_started
      zap:
        condition: service_healthy
    restart: unless-stopped

volumes:
  buns-data:
